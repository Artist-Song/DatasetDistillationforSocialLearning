project:
  name: social_packet_learning
  stage: fullclass_pool_communication_gate
  output_root: ./outputs
  run_name: cifar100_4agent_25cls_fullclass_pool_seed0_ipc10
  comparability_group: cifar100_4agent_25cls_fullclass_pool_standard_r18_ipc10
dataset:
  name: cifar100
  data_dir: ./data
  num_classes: 100
  image_size: 32
  partition: class_disjoint_fullclass_pool_slice
  source_split: original_cifar100_train_test
model_pool:
  default: convnet3w1
  models:
    convnet3w1:
      family: convnet
      depth: 3
      width: 1.0
      norm_type: instance
      distillation:
        f_idx: '2'
        lr_img: 0.1
        niter: 10000
      expert_training:
        separate: true
        epochs: 500
        lr: 0.01
        batch_size: 128
        augment: false
        use_dsdm_train: true
        scheduler: multistep
        scheduler_milestones:
        - 333
        - 416
        scheduler_gamma: 0.2
        validation_fraction: 0.1
        eval_interval: 5
        retrain_full: true
    convnet4w15:
      family: convnet
      depth: 4
      width: 1.5
      norm_type: instance
      distillation:
        f_idx: '3'
        lr_img: 0.1
        niter: 10000
      expert_training:
        separate: true
        epochs: 500
        lr: 0.01
        batch_size: 128
        augment: false
        use_dsdm_train: true
        scheduler: multistep
        scheduler_milestones:
        - 333
        - 416
        scheduler_gamma: 0.2
        validation_fraction: 0.1
        eval_interval: 5
        retrain_full: true
    alexnet:
      family: alexnet
      norm_type: batch
      distillation:
        f_idx: '7'
        lr_img: 0.005
        niter: 10000
      expert_training:
        separate: true
        epochs: 500
        lr: 0.01
        batch_size: 128
        augment: true
        use_dsdm_train: false
        scheduler: multistep
        scheduler_milestones:
        - 333
        - 416
        scheduler_gamma: 0.2
        validation_fraction: 0.1
        eval_interval: 5
        retrain_full: true
    resnet10:
      family: resnet
      depth: 10
      norm_type: batch
      distillation:
        f_idx: '5'
        lr_img: 0.01
        niter: 10000
    resnet18:
      family: resnet
      depth: 18
      norm_type: batch
      distillation:
        f_idx: '5'
        lr_img: 0.01
        niter: 10000
    resnet18_standard:
      family: resnet_cifar_standard
      display_name: ResNet-18-CIFAR-w1.0
      depth: 18
      norm_type: batch
      distillation:
        f_idx: '5'
        lr_img: 0.01
        niter: 10000
      guide_training:
        num_models: 10
        max_epochs: 200
        snapshot_epochs:
        - 200
        selected_epoch: 200
        lr: 0.1
        batch_size: 128
        augment: true
        scheduler: cosine
        scheduler_milestones: []
        scheduler_gamma: 0.1
      expert_training:
        separate: true
        epochs: 200
        lr: 0.1
        batch_size: 128
        augment: true
        use_dsdm_train: false
        scheduler: cosine
        scheduler_milestones: []
        scheduler_gamma: 0.1
        validation_fraction: 0.1
        eval_interval: 5
        retrain_full: true
distillation:
  method: dsdm
  ipc: 10
  factor: 2
  init: mix
  decode_type: single
  aug_type: color_crop_cutout
  match: semantic
  metric: mse
  f_idx: '2'
  niter: 10000
  evaluate_iterations: []
  lr_img: 0.1
  mom_img: 0.5
  batch_real: 256
  batch_syn_max: 256
  smooth_iter: 2000
  cov_weight: 50.0
  h_p_weight: 0.2
  smooth_factor: 0.99
  pretrained_model_number: 10
  pretrained_epochs: 20
selection:
  enabled: true
  methods:
  - heuristic
  - full_real
  heuristic:
    strategy: random_per_class
packet:
  enabled: true
  format: hard_label_images
communication:
  enabled: true
  protocol: none
  mode: direct
  use_sender_logits: true
  use_generalist_logits: false
  packet_source: backbone_specific_fullclass_pool_slice
  pool_catalog: configs/packet_pools/cifar100_fullclass_ipc10_seed0.yaml
agents:
  num_agents: 4
  num_classes: 100
  class_split:
