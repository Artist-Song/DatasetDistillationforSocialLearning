project:
  name: social_packet_learning
  stage: fullclass_dsdm_pool_ablation
  output_root: ./outputs
  run_name: cifar100_fullclass_dsdm_alexnet_trajectorye0020to0200step0020_ipc10_seed0
  comparability_group: cifar100_fullclass_dsdm_dsdmguidee0200_seed0
dataset:
  name: cifar100
  data_dir: ./data
  num_classes: 100
  image_size: 32
  partition: full_class_pool
  source_split: original_cifar100_train_test
  class_assignment: global_0_99
  class_assignment_seed: 0
model_pool:
  default: convnet3w1
  models:
    convnet3w1:
      family: convnet
      depth: 3
      width: 1.0
      norm_type: instance
      distillation:
        f_idx: '2'
        lr_img: 0.1
        niter: 10000
    convnet4w15:
      family: convnet
      depth: 4
      width: 1.5
      norm_type: instance
      distillation:
        f_idx: '3'
        lr_img: 0.1
        niter: 10000
    alexnet:
      family: alexnet
      norm_type: batch
      distillation:
        f_idx: '7'
        lr_img: 0.1
        niter: 10000
      guide_training:
        num_models: 10
        max_epochs: 200
        snapshot_epochs:
        - 200
        selected_epoch: 200
        lr: 0.01
        batch_size: 256
        augment: false
        scheduler: none
        scheduler_milestones: []
        scheduler_gamma: 0.1
        training_style: dsdm_single_trajectory
        pool_design: single_trajectory_epoch_snapshots
        trajectory_count: 1
        trajectory_checkpoint_epochs: &id001
        - 20
        - 40
        - 60
        - 80
        - 100
        - 120
        - 140
        - 160
        - 180
        - 200
      expert_training:
        separate: false
        epochs: 500
        lr: 0.01
        batch_size: 128
        augment: true
        use_dsdm_train: false
        scheduler: multistep
        scheduler_milestones:
        - 333
        - 416
        scheduler_gamma: 0.2
        validation_fraction: 0.1
        eval_interval: 5
        retrain_full: true
    resnet10:
      family: resnet
      depth: 10
      norm_type: batch
      distillation:
        f_idx: '5'
        lr_img: 0.01
        niter: 10000
    resnet18:
      family: resnet
      depth: 18
      norm_type: batch
      distillation:
        f_idx: '5'
        lr_img: 0.01
        niter: 10000
distillation:
  method: dsdm
  ipc: 10
  factor: 2
  init: mix
  decode_type: single
  aug_type: color_crop_cutout
  match: grad
  metric: mse
  f_idx: '2'
  niter: 10000
  evaluate_iterations:
  - 500
  - 1000
  - 1500
  - 2000
  - 2500
  - 3000
  - 3500
  - 4000
  - 4500
  - 5000
  - 5500
  - 6000
  - 6500
  - 7000
  - 7500
  - 8000
  - 8500
  - 9000
  - 9500
  - 10000
  lr_img: 0.1
  mom_img: 0.5
  batch_real: 256
  batch_syn_max: 256
  smooth_iter: 2000
  cov_weight: 50.0
  h_p_weight: 0.2
  smooth_factor: 0.99
  pretrained_model_number: 10
  pretrained_epochs: 200
  evaluate_iter: 500
  load_memory: true
  mixup: cut
  mixup_net: cut
  beta: 1.0
  mix_p: 0.5
  dsa: true
  dsa_strategy: color_crop_cutout_flip_scale_rotate
  bias: false
  fc: false
  grad_clip_norm: 0.0
  guide_model_mode: train
  freeze_guide_parameters: false
  official_dsdm_protocol: true
  official_dsdm_commit: cb12851831e39da6b0169da84598166ad7706e01
  reproduce: true
