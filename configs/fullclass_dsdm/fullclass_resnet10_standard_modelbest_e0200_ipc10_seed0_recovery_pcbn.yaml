project:
  name: social_packet_learning
  stage: fullclass_dsdm_model_specific_pcbn_control
  output_root: ./outputs
  run_name: cifar100_fullclass_dsdm_resnet10_standard_modelbest_e0200_ipc10_seed0_recovery_pcbn_w960
  comparability_group: cifar100_fullclass_dsdm_model_specific_e0200_seed0
dataset:
  name: cifar100
  data_dir: ./data
  num_classes: 100
  image_size: 32
  partition: full_class_pool
  source_split: original_cifar100_train_test
  class_assignment: global_0_99
  class_assignment_seed: 0
model_pool:
  default: convnet3w1
  models:
    convnet3w1:
      family: convnet
      depth: 3
      width: 1.0
      norm_type: instance
      distillation:
        f_idx: '2'
        lr_img: 0.1
        niter: 10000
    convnet4w15:
      family: convnet
      depth: 4
      width: 1.5
      norm_type: instance
      distillation:
        f_idx: '3'
        lr_img: 0.1
        niter: 10000
    alexnet:
      family: alexnet
      norm_type: batch
      distillation:
        f_idx: '7'
        lr_img: 0.005
        niter: 10000
    resnet10:
      family: resnet
      depth: 10
      norm_type: batch
      distillation:
        f_idx: '5'
        lr_img: 0.01
        niter: 10000
    resnet18:
      family: resnet
      depth: 18
      norm_type: batch
      distillation:
        f_idx: '5'
        lr_img: 0.01
        niter: 10000
    resnet10_standard:
      family: resnet_cifar_standard
      display_name: ResNet-10-CIFAR-w1.0
      depth: 10
      norm_type: batch
      distillation:
        f_idx: '5'
        lr_img: 0.01
        niter: 10000
      guide_training:
        num_models: 10
        max_epochs: 200
        snapshot_epochs:
        - 200
        selected_epoch: 200
        lr: 0.1
        batch_size: 128
        augment: true
        scheduler: cosine
        scheduler_milestones: []
        scheduler_gamma: 0.1
        source_root: /root/autodl-tmp/DatasetDistillationforSocialLearning/outputs/cifar100_fullclass_dsdm_resnet10_standard_modelbest_e0200_ipc10_seed0
      expert_training:
        separate: false
        epochs: 200
        lr: 0.1
        batch_size: 128
        augment: true
        use_dsdm_train: false
        scheduler: cosine
        scheduler_milestones: []
        scheduler_gamma: 0.1
        validation_fraction: 0.1
        eval_interval: 5
        retrain_full: true
distillation:
  method: dsdm
  ipc: 10
  factor: 2
  init: mix
  decode_type: single
  aug_type: color_crop_cutout
  match: semantic
  metric: mse
  f_idx: '5'
  niter: 10000
  evaluate_iterations:
  - 100
  - 500
  - 1000
  - 2000
  - 3000
  - 5000
  - 7500
  - 10000
  lr_img: 0.01
  mom_img: 0.5
  batch_real: 256
  batch_syn_max: 256
  smooth_iter: 2000
  cov_weight: 50.0
  h_p_weight: 0.2
  smooth_factor: 0.99
  pretrained_model_number: 10
  pretrained_epochs: 200
  evaluate_iter: 500
  pcbn:
    enabled: true
    weight: 960.0
    layers: all
    normalize_layers: true
selection:
