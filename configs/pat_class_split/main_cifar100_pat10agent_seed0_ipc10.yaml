project:
  name: social_packet_learning
  stage: pat10agent_seed0_ipc10_validation
  output_root: ./outputs
  run_name: cifar100_pat10agent_10cls_ours_seed0_ipc10
  comparability_group: cifar100_pat10agent_10cls_ours_ipc10
dataset:
  name: cifar100
  data_dir: ./data
  num_classes: 100
  image_size: 32
  partition: pat_class_disjoint
  source_split: original_cifar100_train_test
  class_assignment: numpy_randomstate_permutation
  class_assignment_seed: 0
model_pool:
  default: convnet3w1
  models:
    convnet3w1:
      family: convnet
      depth: 3
      width: 1.0
      norm_type: instance
      distillation:
        f_idx: '2'
        lr_img: 0.1
        niter: 10000
    convnet4w15:
      family: convnet
      depth: 4
      width: 1.5
      norm_type: instance
      distillation:
        f_idx: '3'
        lr_img: 0.1
        niter: 10000
    alexnet:
      family: alexnet
      norm_type: batch
      distillation:
        f_idx: '7'
        lr_img: 0.005
        grad_clip_norm: 100.0
        niter: 10000
    resnet10:
      family: resnet
      depth: 10
      norm_type: batch
      distillation:
        f_idx: '5'
        lr_img: 0.01
        niter: 10000
    resnet18:
      family: resnet
      depth: 18
      norm_type: batch
      distillation:
        f_idx: '5'
        lr_img: 0.01
        niter: 10000
distillation:
  method: dsdm
  ipc: 10
  factor: 2
  init: mix
  decode_type: single
  aug_type: color_crop_cutout
  match: semantic
  metric: mse
  f_idx: '2'
  niter: 10000
  evaluate_iterations:
  - 100
  - 500
  - 1000
  - 2000
  - 3000
  - 5000
  - 7500
  - 10000
  lr_img: 0.1
  mom_img: 0.5
  batch_real: 256
  batch_syn_max: 256
  smooth_iter: 2000
  cov_weight: 50.0
  h_p_weight: 0.2
  smooth_factor: 0.99
  pretrained_model_number: 10
  pretrained_epochs: 20
selection:
  enabled: true
  methods:
  - heuristic
  - full_real
  heuristic:
    strategy: random_per_class
packet:
  enabled: true
  format: hard_label_images
communication:
  enabled: true
  protocol: none
  mode: direct
  use_sender_logits: true
  use_generalist_logits: false
