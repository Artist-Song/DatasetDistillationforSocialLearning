social_learning:
  receiver:
    epochs: 60
    lr: 0.01
    lambda_fr: 0.2
    self_class_weight: 2.0
logits:
  enabled: true
  lambda_kd: 0.6
  temperature: 2.0
evaluation:
  enabled: true
  epochs: 1500
  batch_size: 64
  repeat: 1
runtime:
