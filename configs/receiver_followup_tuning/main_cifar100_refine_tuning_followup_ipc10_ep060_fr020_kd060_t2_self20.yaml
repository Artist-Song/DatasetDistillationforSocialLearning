project:
  name: social_packet_learning
  stage: receiver_followup_tuning
  output_root: ./outputs
  run_name: cifar100_4agent_25cls_refine_tuning_followup_ipc10_ep060_fr020_kd060_t2_self20
dataset:
  name: cifar100
  data_dir: ./data
  num_classes: 100
  image_size: 32
model_pool:
  default: convnet3w1
  models:
    convnet3w05:
      family: convnet
      depth: 3
      width: 0.5
      norm_type: instance
    convnet3w1:
      family: convnet
      depth: 3
      width: 1.0
      norm_type: instance
    convnet4w1:
      family: convnet
      depth: 4
      width: 1.0
      norm_type: instance
    convnet4w15:
      family: convnet
      depth: 4
      width: 1.5
      norm_type: instance
centralized_full:
  recipes:
    convnet3w05:
      recipe_name: conv_family_dsdm_strict
      epochs: 500
      lr: 0.01
      batch_size: 128
      momentum: 0.9
      weight_decay: 0.0005
      augment: false
      use_dsdm_train: true
      scheduler: multistep
      scheduler_milestones:
      - 333
      - 416
      scheduler_gamma: 0.2
    convnet3w1:
      recipe_name: conv_family_dsdm_strict
      epochs: 500
      lr: 0.01
      batch_size: 128
      momentum: 0.9
      weight_decay: 0.0005
      augment: false
      use_dsdm_train: true
      scheduler: multistep
      scheduler_milestones:
      - 333
      - 416
      scheduler_gamma: 0.2
    convnet4w1:
      recipe_name: conv_family_dsdm_strict
      epochs: 500
      lr: 0.01
      batch_size: 128
      momentum: 0.9
      weight_decay: 0.0005
      augment: false
      use_dsdm_train: true
      scheduler: multistep
      scheduler_milestones:
      - 333
      - 416
      scheduler_gamma: 0.2
    convnet4w15:
      recipe_name: conv_family_dsdm_strict
      epochs: 500
      lr: 0.01
      batch_size: 128
      momentum: 0.9
      weight_decay: 0.0005
      augment: false
      use_dsdm_train: true
      scheduler: multistep
      scheduler_milestones:
      - 333
      - 416
      scheduler_gamma: 0.2
distillation:
  method: dsdm
  ipc: 10
  factor: 2
  init: mix
  decode_type: single
  aug_type: color_crop_cutout
  match: semantic
  metric: mse
  f_idx: '2'
  niter: 10000
  lr_img: 0.1
  mom_img: 0.5
  batch_real: 256
  batch_syn_max: 256
  smooth_iter: 2000
  cov_weight: 50.0
  h_p_weight: 0.2
  smooth_factor: 0.99
selection:
  enabled: true
  methods:
  - heuristic
  - full_real
  heuristic:
    strategy: random_per_class
  importance:
    scorer: guide_ensemble
    score_type: low_confidence
packet:
  enabled: true
  format: hard_label_images
communication:
  enabled: false
  protocol: none
