project:
  name: social_packet_learning
  stage: hetero4arch_ipc50_midpacket_eval
  output_root: ./outputs
  run_name: cifar100_4agent_25cls_hetero4arch_ipc50_midpacket_eval_20260707_0825
dataset:
  name: cifar100
  data_dir: ./data
  num_classes: 100
  image_size: 32
model_pool:
  default: convnet3w1
  models:
    convnet3w1:
      family: convnet
      depth: 3
      width: 1.0
      norm_type: instance
      distillation:
        lr_img: 0.1
    convnet4w15:
      family: convnet
      depth: 4
      width: 1.5
      norm_type: instance
      distillation:
        lr_img: 0.1
    vgg:
      family: vgg
      norm_type: batch
      distillation:
        lr_img: 0.02
        niter: 10000
        pretrain_dir: /root/autodl-tmp/outputs/dsdm_arch_recipe_cifar100_ipc10/pretrained_factor2_probe_parallel/e20/vgg
    alexnet:
      family: alexnet
      norm_type: batch
      distillation:
        lr_img: 0.005
        niter: 10000
        pretrain_dir: /root/autodl-tmp/outputs/dsdm_arch_recipe_cifar100_ipc10/pretrained_factor2_probe/e20/alexnet
centralized_full:
  recipes:
    convnet3w1:
      recipe_name: conv_family_dsdm_strict
      epochs: 500
      lr: 0.01
      batch_size: 128
      momentum: 0.9
      weight_decay: 0.0005
      augment: false
      use_dsdm_train: true
      scheduler: multistep
      scheduler_milestones:
      - 333
      - 416
      scheduler_gamma: 0.2
    convnet4w15:
      recipe_name: conv_family_dsdm_strict
      epochs: 500
      lr: 0.01
      batch_size: 128
      momentum: 0.9
      weight_decay: 0.0005
      augment: false
      use_dsdm_train: true
      scheduler: multistep
      scheduler_milestones:
      - 333
      - 416
      scheduler_gamma: 0.2
    vgg:
      recipe_name: vgg_cifar_recipe
      epochs: 500
      lr: 0.01
      batch_size: 128
      momentum: 0.9
      weight_decay: 0.0005
      augment: true
      use_dsdm_train: false
      scheduler: multistep
      scheduler_milestones:
      - 333
      - 416
      scheduler_gamma: 0.2
    alexnet:
      recipe_name: alexnet_cifar_recipe
      epochs: 500
      lr: 0.01
      batch_size: 128
      momentum: 0.9
      weight_decay: 0.0005
      augment: true
      use_dsdm_train: false
      scheduler: multistep
      scheduler_milestones:
      - 333
      - 416
      scheduler_gamma: 0.2
distillation:
  method: dsdm
  ipc: 50
  factor: 2
  init: mix
  decode_type: single
  aug_type: color_crop_cutout
  match: semantic
  metric: mse
  f_idx: '2'
  niter: 10000
  lr_img: 0.1
  mom_img: 0.5
  batch_real: 256
  batch_syn_max: 256
  smooth_iter: 2000
  cov_weight: 50.0
  h_p_weight: 0.2
  smooth_factor: 0.99
  pretrained_model_number: 10
  pretrained_epochs: 20
selection:
  enabled: true
  methods:
  - heuristic
  - full_real
  heuristic:
    strategy: random_per_class
  importance:
    scorer: guide_ensemble
    score_type: low_confidence
packet:
  enabled: true
  format: hard_label_images
communication:
