version: 1
updated_at: '2026-07-17'
selection_policy:
  primary: global
  near_tie_threshold: 0.5
  near_tie_preferences:
    - higher_new
    - lower_forgetting

experiments:
  - id: one_resnet_ours_ipc10
    title: Ours
    role: main
    status: complete
    paper_eligible: true
    table_section: ipc
    table_order: 50
    ipc: 10
    packet: Distilled images
    soft_labels: Sender expert logits
    protocol: one-ResNet self-guided DSDM
    comparability_group: one_resnet_ipc10_image_budget
    source:
      type: pipeline
      path_template: outputs/cifar100_4agent_25cls_one_resnet_seed{seed}_ipc10/metrics/social_results.csv
      expected_seeds: [0, 1, 2]
      method: DSDM_LOGIT
      receiver_key: receiver_agent
      expected_receivers: [0, 1, 2, 3]
      metrics:
        global: acc_global_after
        new: acc_new_after
        expert: acc_expert_after
        forgetting: forgetting

  - id: one_resnet_ours_ipc50
    title: Ours
    role: main
    status: interim
    paper_eligible: true
    allow_partial: true
    table_section: ipc
    table_order: 50
    ipc: 50
    packet: Distilled images
    soft_labels: Sender expert logits
    protocol: one-ResNet self-guided DSDM
    comparability_group: one_resnet_ipc50_image_budget
    caveat: Interim until seed1 has four receiver rows.
    source:
      type: pipeline
      path_template: outputs/cifar100_4agent_25cls_one_resnet_seed{seed}_ipc50/metrics/social_results.csv
      expected_seeds: [0, 1, 2]
      method: DSDM_LOGIT
