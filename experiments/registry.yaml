  - id: masc_complete_ipc10
    title: MASC-complete
    role: baseline
    status: complete
    paper_eligible: true
    table_section: ipc
    table_order: 10
    ipc: 10
    packet: Real CC images
    soft_labels: Teacher KD
    protocol: homogeneous official Netwider; CC + RA + HFE; model interaction
    comparability_group: adapted_baseline_ipc10
    caveat: Single seed and about 452 MB model-parameter interaction.
    source:
      type: average_row
      path: external_baselines/outputs/masc_complete/seed0_10/social_results.csv
      average_key: agent_id
      average_value: avg
      metrics: &average_metrics
        global: acc_global
        new: acc_new
        expert: acc_expert
        forgetting: forgetting

