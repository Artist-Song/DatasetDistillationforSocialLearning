baselines:
  fast:
    name: "FAST: Topology-Aware Frequency-Domain Distribution Matching for Coreset Selection"
    role: "DNN-free real-image coreset selection baseline"
    url: "https://github.com/CAG-Research/FAST-Coreset-Selection"
    local_path: "external_baselines/repos/FAST"
    commit: "6a218fcfdc93838634921399b0de6a36cdd29756"
    paper: "https://openaccess.thecvf.com/content/CVPR2026/html/Cui_FAST_Topology-Aware_Frequency-Domain_Distribution_Matching_for_Coreset_Selection_CVPR_2026_paper.html"
    main_entry: "modules/per_class.py"
    notes:
      - "Official CVPR 2026 implementation."
      - "Use pixels/per-class/minmax mode and exact IPC=10/50 per expert class."
      - "Transmit selected real images with hard labels only; no logits and factor=1."
      - "Apply baseline_adapters/patches/fast_numpy_broadcast.patch to fix NumPy boolean-index broadcasting in graph-aware Hungarian matching."
  fedproto:
    name: "FedProto: Federated Prototype Learning across Heterogeneous Clients"
    role: "classic prototype-based heterogeneous FL baseline"
    url: "https://github.com/yuetan031/FedProto"
    local_path: "external_baselines/repos/FedProto"
    commit: "97e42e2741e1ae2e2fce2465e80f38f6997f8836"
    paper: "https://arxiv.org/abs/2105.00243"
    main_entry: "exps/federated_main.py"
    notes:
      - "Official implementation for AAAI 2022 FedProto."
      - "Original code supports MNIST/FEMNIST/CIFAR10; CIFAR-100 socialized split needs adapter."
      - "Communication object is class prototype tensors, not image IPC."
  masc:
    name: "Socialized Learning / MASC"
    role: "original socialized learning reference framework"
    url: "https://github.com/yxjdarren/SL"
    local_path: "external_baselines/repos/MASC_SL"
    commit: "efcca8e9be2df1a4892ff569e2a4eea860bcb361"
    paper: "MASC - Socialized Learning Through Multi-Agent Collaboration.pdf"
    main_entry: "MASC_SL_inference_CIFAR100_raw_4_25/test_multi_agent_cifar100_ts.py"
    notes:
      - "Official code for ICML 2024 Socialized Learning."
      - "Contains CIFAR-100 raw 4-agent 25-class setting, aligned with our task."
      - "Use IPC=10/50 by limiting each agent's real images sent to the MASC generalist."
      - "Do not claim MASC is model-heterogeneous; compare as original socialized-learning reference."
  desa:
    name: "DeSA: Decentralized Synthetic Anchors"
    role: "synthetic-anchor decentralized model-heterogeneous FL baseline"
    url: "https://github.com/ubc-tea/DESA"
    local_path: "external_baselines/repos/DESA"
    commit: "efccf9bc9817305c01c9e6f5c62b8b43d56f6a9a"
    paper: "DeSA - Data and Model Heterogeneities in Decentralized FL.pdf"
    main_entry: "iterative_desa.py"
    notes:
      - "Official implementation."
      - "Synthetic anchors are generated with distribution matching; default net is a random ConvNet when net=None."
      - "Adapt IPC=10/50 as 25*IPC synthetic anchors per agent."
      - "If anchor logits are exchanged, record image bytes and logit bytes separately."
  fedre:
    name: "FedRE: A Representation Entanglement Framework for Model-Heterogeneous Federated Learning"
    role: "recent model-heterogeneous FL baseline"
    url: "https://github.com/AIResearch-Group/FedRE"
    local_path: "external_baselines/repos/FedRE"
    commit: "9e2164343ee0d76be60afe46e2b986b9f77ef1cb"
    paper: "https://arxiv.org/pdf/2511.22265"
    main_entry: "HtFLlib/system/main.py"
    notes:
      - "Official implementation for CVPR 2026 FedRE."
      - "Repository includes Cifar100 generator and model-heterogeneous system code."
      - "Faithful adaptation first: run complete method on our task, record communication rounds and bytes."
      - "Do not force IPC initially because transmitted objects are representations/encodings rather than images."
